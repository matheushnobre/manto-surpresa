name: Build CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Backend
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./manto-surpresa-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend
        working-directory: ./manto-surpresa-backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/docs > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 1
          done

          echo "Backend failed to start"
          exit 1

      # Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: manto-surpresa-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./manto-surpresa-frontend
        run: npm ci

      - name: Lint
        working-directory: ./manto-surpresa-frontend
        run: npm run lint

      - name: Build
        working-directory: ./manto-surpresa-frontend
        run: npm run build